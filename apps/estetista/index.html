<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b03f96">
  <title>Bellezza · Gestionale del centro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
  <link rel="stylesheet" href="stc/tokens.css">
  <link rel="stylesheet" href="stc/bundle.css">
  <script>
    // Il tema lo sceglie la persona; al primo accesso si parte dal sistema (D11).
    try {
      var t = localStorage.getItem('bellezza:tema');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script src="stc/lib/react.production.min.js"></script>
  <script src="stc/lib/react-dom.production.min.js"></script>
  <script src="stc/bundle.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
