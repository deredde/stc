<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>CheckboxCards · anteprima</title><style>
body { padding: 20px; }
.p-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.p-col { display: flex; flex-direction: column; gap: 14px; }
.p-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.p-lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); }
.p-frame { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--page-bg); }
.p-note { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-secondary); padding: 10px 12px; background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 10px; }
.p-spotbox { padding: 16px; min-height: 210px; overflow: hidden; border-radius: 12px; position: relative; isolation: isolate; }
</style></head>
<body>
<div id="root"></div>
<script>
const h=React.createElement;const{useState,Fragment}=React;const{CheckboxCards,formatEuro}=window.STC;const O=[{value:'sms',icon:'message-square',title:'Promemoria via SMS',description:'Il giorno prima di ogni appuntamento.',side:'+ € 9,00',sideNote:'al mese',p:9},{value:'fe',icon:'receipt-euro',title:'Fatturazione elettronica',description:'Invio allo SdI e conservazione per 10 anni.',side:'+ € 15,00',sideNote:'al mese',p:15},{value:'app',icon:'smartphone',title:'App per i clienti',description:'Tessera, prenotazioni e pagamenti dal telefono.',side:'+ € 29,00',sideNote:'al mese',p:29}];
function Demo(){const[s,setS]=useState(['sms']);const tot=O.filter(o=>s.includes(o.value)).reduce((a,o)=>a+o.p,0);
return h('div',{className:'p-col',style:{maxWidth:520,gap:12}},h(CheckboxCards,{options:O,value:s,onChange:setS,label:'Moduli'}),h('div',{className:'p-row',style:{justifyContent:'space-between',fontSize:13,color:'var(--text-secondary)'}},h('span',null,s.length+' moduli aggiunti'),h('span',{className:'stc-num',style:{color:'var(--text-primary)'}},'+ '+formatEuro(tot)+' al mese')))}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
