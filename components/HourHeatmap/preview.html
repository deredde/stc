<html lang="it">
<head><meta charset="utf-8"><title>HourHeatmap · anteprima</title><style>
body { padding: 20px; }
.p-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.p-col { display: flex; flex-direction: column; gap: 14px; }
.p-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

<body>
<div id="root"></div>
<script>
const h=React.createElement;const{useState,Fragment}=React;const{Card,ChartHeader,HourHeatmap}=window.STC;const H=Array.from({length:15},(_,i)=>7+i);
const R=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map((d,j)=>({label:d,values:H.map(x=>Math.round((x>=17&&x<=20?3.3:x<=9?2.4:x>=12&&x<=13?2:1)*(j>4?(x>9&&x<14?1.2:.4):1)*10))}));

ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
