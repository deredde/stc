<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>TypingDots · anteprima</title><style>
body { padding: 20px; }
.p-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.p-col { display: flex; flex-direction: column; gap: 14px; }
.p-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }

<body>
<div id="root"></div>
<script>
const S=window.STC,h=React.createElement,{useState,useEffect}=React;
function useTick(ms,n){const[i,setI]=useState(0);useEffect(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const t=setInterval(()=>setI(x=>(x+1)%n),ms);return()=>clearInterval(t)},[]);return i}
function useProgress(){const[p,setP]=useState(matchMedia("(prefers-reduced-motion: reduce)").matches?64:0);useEffect(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const t=setInterval(()=>setP(x=>x>=100?0:Math.min(100,x+2+Math.random()*3)),220);return()=>clearInterval(t)},[]);return p}
function Demo(){return h("div",{className:"p-col",style:{alignItems:"flex-start",gap:8}},h(S.TypingDots,{label:"Giulia Ferri sta scrivendo"}),h("span",{style:{fontSize:12,color:"var(--text-tertiary)"}},"Giulia Ferri sta scrivendo"))}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
