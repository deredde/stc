<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>STC</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--page-bg); color: var(--text-primary); font-family: var(--font-text); overflow: hidden; padding: 0; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; }
  .slab { fill: var(--text-primary); rx: var(--r-16); }
  .dot { fill: var(--accent-400); }
  .brand { fill: var(--accent-400); rx: var(--r-16); }
  .tint { fill: var(--accent-200); rx: var(--r-16); }
  .pill { fill: var(--accent-wash-strong); rx: var(--r-10); }
  .bar { fill: var(--accent-line); rx: 1.5px; }
  .words { position: absolute; left: var(--sp-8); bottom: var(--sp-8); max-width: 440px; }
  .name { margin: 0; line-height: 0; }
  .mark { display: block; height: 184px; width: auto; }
  .mark--d { display: none; }
  [data-theme="dark"] .mark--l { display: none; }
  [data-theme="dark"] .mark--d { display: block; }
  .tag { margin: var(--sp-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
